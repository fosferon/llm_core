# Base llm_core configuration

[routing]
# No default is shipped: consumers set `default` in their project or home layer.
# With none anywhere, routing fails loudly ({:error, {:no_routing_default, _}}).

[routing.tasks.coding]
alias = "openai"
mode = "passthrough"
capabilities = { structured_output = true, tool_use = true }

[routing.tasks.planning]
alias = "claude"
mode = "abstracted"
capabilities = { reasoning = true }

[memory]
backend = "hindsight_rest"

[memory.hindsight]
enabled = true
default_bank_id = "${HINDSIGHT_DEFAULT_BANK}"
url = "${HINDSIGHT_URL}"
timeout_recall_ms = 4000
timeout_reflect_ms = 5000

[telemetry]
log_pipeline_events = true
log_provider_dispatch = true
sample_rate = 1.0
enable_logger = true
logger_level = "info"

[providers.anthropic]
module = "LlmCore.LLM.Anthropic"
type = "cloud"
enabled = true
default_model = "claude-3-5-sonnet"
aliases = ["anthropic", "claude"]
cost_tier = "premium"

[providers.anthropic.agent]
name = "claude"
config = {model = "claude-3-5-sonnet", temperature = 0.2}

[providers.anthropic.auth]
api_key_env = "ANTHROPIC_API_KEY"

[providers.anthropic.capabilities]
structured_output = true
tool_use = true
vision = true
streaming = true

[providers.openai]
module = "LlmCore.LLM.OpenAI"
type = "cloud"
enabled = true
default_model = "gpt-4o-mini"
aliases = ["openai", "gpt"]
cost_tier = "standard"

[providers.openai.agent]
name = "openai"
config = {model = "gpt-4o-mini", temperature = 0.1}

[providers.openai.auth]
api_key_env = "OPENAI_API_KEY"

[providers.openai.capabilities]
structured_output = true
tool_use = true
vision = true
streaming = true

[providers.ollama]
module = "LlmCore.LLM.Ollama"
type = "local"
enabled = true
default_model = "llama3.1"
aliases = ["ollama", "local"]
cost_tier = "local"

[providers.ollama.agent]
name = "ollama"
config = {model = "llama3.1", temperature = 0.7}

[providers.ollama.options]
base_url = "${OLLAMA_URL:http://localhost:11434}"

[providers.ollama.capabilities]
structured_output = true
tool_use = false
vision = false
streaming = true

[providers.appliance]
module = "LlmCore.LLM.Appliance"
type = "local"
enabled = true
default_model = "qwen3.5-27b-claude-4.6-opus-distilled-mlx"
aliases = ["appliance", "local", "lmstudio"]
cost_tier = "free"

[providers.appliance.capabilities]
tool_use = true
streaming = true

[providers.zai]
module = "LlmCore.LLM.OpenAI"
type = "cloud"
enabled = true
default_model = "glm-5.1"
aliases = ["zai", "z"]
cost_tier = "plan"

[providers.zai.config]
base_url = "https://api.z.ai/api/coding/paas/v4"

[providers.zai.auth]
api_key_env = "ZAI_API_KEY"

[providers.zai.capabilities]
tool_use = true
streaming = true

# ── CLI Providers ─────────────────────────────────────────────
#
# CLI providers use type = "cli" and configure the CLI surface in
# [providers.<id>.cli]. No Elixir module needed — just config.
#
# To add a custom CLI provider, copy any block below and adjust.
# To override a default, redefine the same [providers.<id>] in a
# project or global override TOML.

[providers.claude_code]
type = "cli"
enabled = true
aliases = ["claude-code"]

[providers.claude_code.cli]
binary = "claude"
default_timeout = 1800000
model_resolution = "provider_runtime"
prompt_position = "flagged"
prompt_flag = "-p"
prompt_transport = "flagged"
system_prompt_transport = "file_flag"
add_dir_flag = "--add-dir"
output_mode = "stdout_text"
stdin_hack = true
prefix_args = ["--print"]
install_hint = "Install with: npm install -g @anthropic/claude-code"

[providers.claude_code.cli.flags]
model = "--model"
permission_mode = "--permission-mode"
dangerously_skip_permissions = "--dangerously-skip-permissions"
allow_dangerously_skip_permissions = "--allow-dangerously-skip-permissions"
allowed_tools = "--allowed-tools"
disallowed_tools = "--disallowed-tools"
system_prompt = "--append-system-prompt"
system_prompt_file = "--append-system-prompt-file"
add_dir = "--add-dir"

[providers.claude_code.cli.preflight]
help_args = ["--help"]
expect_in_help = ["--print", "--model"]

[providers.claude_code.capabilities]
streaming = true
passthrough = true

[providers.claude_code.metadata]
cost_tier = "cli"

# ──

[providers.droid]
type = "cli"
enabled = true
aliases = ["droid"]

[providers.droid.cli]
binary = "droid"
subcommand = "exec"
default_timeout = 1800000
default_model = "claude-opus-4-6"
model_resolution = "gc_default"
prompt_position = "last"
prompt_transport = "last"
system_prompt_transport = "file_flag"
cwd_flag = "--cwd"
output_mode = "stdout_text"
stdin_hack = false
auto_approve_args = ["--auto", "high"]
install_hint = "Install with: curl -fsSL https://app.factory.ai/cli | sh"

[providers.droid.cli.flags]
model = "--model"
auto = "--auto"
cwd = "--cwd"
worktree = "--worktree"
system_prompt = "--append-system-prompt"
system_prompt_file = "--append-system-prompt-file"
enabled_tools = "--enabled-tools"
disabled_tools = "--disabled-tools"

[providers.droid.cli.preflight]
help_args = ["exec", "--help"]
expect_in_help = ["--auto", "--cwd"]

[providers.droid.capabilities]
streaming = true
passthrough = true

[providers.droid.metadata]
cost_tier = "cli"

# ──

[providers.pi_cli]
type = "cli"
enabled = true
aliases = ["pi", "pi-cli"]

[providers.pi_cli.cli]
binary = "pi"
default_timeout = 1800000
model_resolution = "provider_runtime"
prompt_position = "last"
prompt_transport = "last"
system_prompt_transport = "file_flag"
output_mode = "stdout_text"
stdin_hack = true
# --no-session --no-extensions: prevent extension auto-loading in
# daemon-dispatched runs where duplicate tool registrations can cause
# Pi startup conflicts and apparent dispatch timeouts.
prefix_args = ["--print", "--no-session", "--no-extensions"]
install_hint = "Install pi CLI and ensure `pi` is in PATH"

[providers.pi_cli.cli.flags]
model = "--model"
provider = "--provider"
thinking = "--thinking"
system_prompt = "--append-system-prompt"
system_prompt_file = "--append-system-prompt"

[providers.pi_cli.cli.preflight]
help_args = ["--help"]
expect_in_help = ["--print", "--model"]

[providers.pi_cli.capabilities]
streaming = true
passthrough = true

[providers.pi_cli.metadata]
cost_tier = "cli"

# ──

[providers.kimi_cli]
type = "cli"
enabled = true
aliases = ["kimi", "kimi-cli", "kimi-code"]

# kimi-code 2.x (binary `kimi`, successor of kimi-cli 1.x).
# Non-interactive mode is `-p/--prompt "<prompt>"`; stdout carries a
# `kimi version X.Y.Z` banner line and a trailing session footer, both
# stripped via output_strip_patterns below. There are no --print,
# --final-message-only, or --work-dir flags in 2.x, and the process cwd
# is set by the caller at spawn (use --add-dir for extra workspace dirs).
[providers.kimi_cli.cli]
binary = "kimi"
default_timeout = 1800000
model_resolution = "provider_runtime"
prompt_position = "flagged"
prompt_flag = "--prompt"
prompt_transport = "flagged"
# --agent-file expects a kimi-code agent definition Markdown file, not a
# raw system prompt, so system prompts are inlined into the user prompt
# instead of going through a file transform.
system_prompt_transport = "inline_fallback"
add_dir_flag = "--add-dir"
output_mode = "stdout_text"
tool_call_transport = "llm_core_json"
stdin_hack = false
prefix_args = []
# kimi-code 2.x prints a `kimi version X.Y.Z` banner as the first stdout
# line and appends a resumable session footer even in prompt mode.
# Strip both at the provider layer so callers see only the reply.
output_strip_patterns = ["\\Akimi version \\d+\\.\\d+\\.\\d+[^\\n]*\\n?", "\\n{2,}To resume this session: kimi -r [^\\n]+\\s*$"]
# kimi-code 2.x rejects --prompt combined with --yolo or --auto, so no
# auto-approve args can be passed in prompt mode.
auto_approve_args = []
install_hint = "Install kimi-code (binary: kimi), https://www.kimi.com/code"

[providers.kimi_cli.cli.flags]
model = "--model"
add_dir = "--add-dir"
system_prompt_file = "--agent-file"

[providers.kimi_cli.cli.preflight]
help_args = ["--help"]
expect_in_help = ["--prompt", "--model", "--agent-file"]

[providers.kimi_cli.capabilities]
streaming = true
passthrough = true

[providers.kimi_cli.metadata]
cost_tier = "cli"

# ──

[providers.codex_cli]
type = "cli"
enabled = true
aliases = ["codex", "codex-cli"]

[providers.codex_cli.cli]
binary = "codex"
subcommand = "exec"
default_timeout = 1800000
model_resolution = "provider_runtime"
prompt_position = "last"
prompt_transport = "last"
system_prompt_transport = "inline_fallback"
cwd_flag = "--cd"
add_dir_flag = "--add-dir"
output_mode = "stdout_text"
stdin_hack = false
# Codex supports writing the final response to a file, bypassing
# stdout session noise (banners, progress indicators, etc.)
output_file_flag = "--output-last-message"
auto_approve_args = ["--full-auto"]
sandbox_bypass_args = ["--dangerously-bypass-approvals-and-sandbox"]
install_hint = "Install with: npm install -g @openai/codex"

[providers.codex_cli.cli.flags]
model = "--model"
cwd = "--cd"
add_dir = "--add-dir"

[providers.codex_cli.cli.preflight]
help_args = ["exec", "--help"]
expect_in_help = ["--full-auto", "--add-dir"]

[providers.codex_cli.capabilities]
streaming = true
passthrough = true

[providers.codex_cli.metadata]
cost_tier = "cli"

# ──

[providers.gemini_cli]
type = "cli"
enabled = true
aliases = ["gemini", "gemini-cli"]

[providers.gemini_cli.cli]
binary = "gemini"
default_timeout = 1800000
model_resolution = "provider_runtime"
prompt_position = "last"
prompt_transport = "last"
output_mode = "stdout_text"
stdin_hack = false
install_hint = "Install the Google Cloud CLI with Gemini support"

[providers.gemini_cli.cli.flags]
model = "--model"

[providers.gemini_cli.cli.preflight]
help_args = ["--help"]

[providers.gemini_cli.capabilities]
streaming = true
passthrough = true

[providers.gemini_cli.metadata]
cost_tier = "cli"

# ── Custom CLI Provider Example ──────────────────────────────
#
# [providers.my_tool]
# type = "cli"
# enabled = true
# aliases = ["my-tool", "mt"]
#
# [providers.my_tool.cli]
# binary = "my-tool"
# default_model = "v2"
# default_timeout = 60000
# prompt_position = "last"
# stdin_hack = false
# install_hint = "pip install my-tool"
# prefix_args = ["--no-interactive"]
# auto_approve_args = ["--yes"]
#
# [providers.my_tool.cli.flags]
# model = "--model"
# temperature = "--temp"
#
# [providers.my_tool.cli.preflight]
# help_args = ["--help"]
# expect_in_help = ["--model"]
#
# [providers.my_tool.capabilities]
# streaming = true
# passthrough = true
#
# [providers.my_tool.metadata]
# cost_tier = "cli"

# ── Native Provider Cascade ──────────────────────────────────
#
# llm_core ships NO native cascade, default models, or model routing: which
# providers a deployment runs, and in what order, is its own decision.
#
# With no [native] cascade configured, the in-process agentic loop uses the
# single provider named by [routing] default. If that is unset or cannot run
# the native loop (CLI providers cannot), the call fails with a structured
# error — it never guesses.
#
# To configure a cascade, add this to your project or home layer
# (providers are tried in order; disabled, CLI-kind and credential-less
# providers are skipped, and a failed call lists every attempt):
#
# [native]
# cascade = ["my_local", "my_cloud"]
#
# [native.default_models]
# my_cloud = "some-model-id"
#
# # When a model name contains the substring, route to the named provider.
# # Evaluated in order; first match wins; an unusable target falls through
# # to the cascade.
# [[native.model_routing]]
# pattern = "some-substring"
# provider = "my_cloud"
